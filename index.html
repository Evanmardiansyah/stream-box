<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GasStream | Tontonan Premium Tanpa Batas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { 
            background-color: #0b0f19; /* Warna gelap premium ala HBO/Disney */
            color: #e2e8f0; 
            font-family: 'Inter', sans-serif; 
        }
        
        /* Sembunyikan scrollbar bawaan tapi tetap bisa di-scroll */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Efek hover pada kartu film */
        .movie-card { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease; }
        .movie-card:hover { transform: scale(1.05) translateY(-5px); z-index: 10; box-shadow: 0 10px 25px rgba(0,0,0,0.8); }
        
        /* Gradient overlay untuk hero banner */
        .hero-gradient { background: linear-gradient(to top, #0b0f19 0%, rgba(11, 15, 25, 0.5) 50%, rgba(11, 15, 25, 0.1) 100%); }
    </style>
</head>
<body class="antialiased overflow-x-hidden">

    <nav id="navbar" class="fixed w-full z-50 transition-all duration-500 py-4 px-6 md:px-12 flex justify-between items-center bg-gradient-to-b from-black/80 to-transparent">
        <h1 class="text-2xl md:text-3xl font-extrabold tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 cursor-pointer" onclick="window.scrollTo(0,0)">
            GASSTREAM.
        </h1>
        <div class="flex space-x-4 text-sm font-semibold">
            <a href="#" class="hover:text-white transition">Beranda</a>
            <a href="#" class="hover:text-white transition">Film</a>
        </div>
    </nav>

    <header id="hero-section" class="relative w-full h-[70vh] md:h-[85vh] flex items-end pb-12 md:pb-24 bg-cover bg-center bg-no-repeat transition-all duration-700" style="background-image: url('');">
        <div class="absolute inset-0 hero-gradient"></div>
        <div class="relative z-10 px-6 md:px-12 w-full max-w-4xl">
            <h1 id="hero-title" class="text-4xl md:text-6xl font-extrabold text-white mb-3 drop-shadow-lg">Memuat...</h1>
            <div class="flex items-center space-x-3 mb-4 text-sm md:text-base font-semibold">
                <span id="hero-rating" class="text-emerald-400 drop-shadow-md">⭐ -</span>
                <span id="hero-year" class="text-gray-300">-</span>
            </div>
            <p id="hero-desc" class="text-gray-300 text-sm md:text-base mb-6 line-clamp-3 md:line-clamp-4 max-w-2xl text-shadow">
                Menarik data dari server...
            </p>
            <div class="flex space-x-4">
                <button id="hero-play-btn" class="bg-white text-black px-6 py-2 md:px-8 md:py-3 rounded-full font-bold hover:bg-gray-200 transition flex items-center shadow-lg shadow-white/20">
                    <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4l12 6-12 6V4z"></path></svg>
                    Putar Sekarang
                </button>
            </div>
        </div>
    </header>

    <div id="player-modal" class="fixed inset-0 z-[100] bg-black/95 hidden flex-col justify-center items-center opacity-0 transition-opacity duration-300">
        <div class="w-full max-w-6xl p-4 flex justify-between items-center bg-gradient-to-b from-black to-transparent absolute top-0">
            <h2 id="player-title" class="text-xl font-bold text-white">Memuat Video...</h2>
            <button onclick="closePlayer()" class="text-gray-400 hover:text-white p-2 rounded-full hover:bg-gray-800 transition">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <div class="w-full max-w-6xl aspect-video bg-black rounded-lg overflow-hidden shadow-2xl mt-12 relative">
            <iframe id="video-frame" class="w-full h-full absolute inset-0" src="" frameborder="0" allowfullscreen sandbox="allow-scripts allow-same-origin allow-presentation"></iframe>
        </div>
    </div>

    <main class="relative z-20 px-6 md:px-12 py-8 -mt-20 md:-mt-32 space-y-12">
        
        <section>
            <h2 class="text-xl md:text-2xl font-bold text-white mb-4 drop-shadow-md">🔥 Sedang Tren</h2>
            <div id="trending-row" class="flex space-x-4 overflow-x-auto hide-scrollbar pb-8 pt-4 px-2 -mx-2">
                </div>
        </section>

        <section>
            <h2 class="text-xl md:text-2xl font-bold text-white mb-4 drop-shadow-md">🏆 Rating Tertinggi</h2>
            <div id="toprated-row" class="flex space-x-4 overflow-x-auto hide-scrollbar pb-8 pt-4 px-2 -mx-2">
                </div>
        </section>

    </main>

    <footer class="text-center text-gray-600 text-sm py-8 mt-12 border-t border-gray-800">
        <p>&copy; 2026 GasStream. Ditenagai oleh TMDB & Vidsrc.</p>
        <p class="text-xs mt-1">Situs ini tidak menyimpan file video di server sendiri.</p>
    </footer>

    <script>
        const TMDB_API_KEY = '15d2ea6d0dc1d476efbca3eba2b9bbfb'; // Ganti dengan key kamu nanti
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_POSTER = 'https://image.tmdb.org/t/p/w342';
        const IMG_BACKDROP = 'https://image.tmdb.org/t/p/original';

        // Efek Navbar saat di-scroll
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('navbar');
            if (window.scrollY > 50) {
                nav.classList.add('bg-black', 'shadow-lg');
                nav.classList.remove('bg-gradient-to-b', 'from-black/80', 'to-transparent');
            } else {
                nav.classList.remove('bg-black', 'shadow-lg');
                nav.classList.add('bg-gradient-to-b', 'from-black/80', 'to-transparent');
            }
        });

        // Ambil Data Film
        async function fetchMovies(endpoint, containerId, isHero = false) {
            try {
                const res = await fetch(`${BASE_URL}${endpoint}?api_key=${TMDB_API_KEY}&language=id-ID`);
                const data = await res.json();
                
                if (isHero) {
                    setHero(data.results[0]); // Ambil film urutan pertama untuk Hero Banner
                    renderRow(data.results.slice(1), containerId); // Sisanya masuk ke slider
                } else {
                    renderRow(data.results, containerId);
                }
            } catch (error) {
                console.error("Gagal mengambil data", error);
            }
        }

        // Setup Hero Banner
        function setHero(movie) {
            const heroSection = document.getElementById('hero-section');
            const title = document.getElementById('hero-title');
            const desc = document.getElementById('hero-desc');
            const rating = document.getElementById('hero-rating');
            const year = document.getElementById('hero-year');
            const playBtn = document.getElementById('hero-play-btn');

            heroSection.style.backgroundImage = `url(${IMG_BACKDROP}${movie.backdrop_path})`;
            title.innerText = movie.title || movie.name;
            desc.innerText = movie.overview || "Sinopsis tidak tersedia.";
            rating.innerText = `⭐ ${movie.vote_average.toFixed(1)}`;
            year.innerText = movie.release_date ? movie.release_date.substring(0, 4) : '';

            // Event tombol play hero
            playBtn.onclick = () => openPlayer(movie.id, movie.title || movie.name);
        }

        // Render Baris Film (Horizontal Slider)
        function renderRow(movies, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            movies.forEach(movie => {
                if(movie.poster_path) {
                    const card = document.createElement('div');
                    card.className = 'movie-card flex-none w-[140px] md:w-[180px] lg:w-[220px] rounded-lg overflow-hidden cursor-pointer relative group bg-gray-800';
                    card.onclick = () => openPlayer(movie.id, movie.title || movie.name);

                    card.innerHTML = `
                        <img src="${IMG_POSTER}${movie.poster_path}" alt="${movie.title}" class="w-full h-auto object-cover rounded-lg" loading="lazy">
                        <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-3">
                            <h3 class="text-white text-sm font-bold truncate">${movie.title || movie.name}</h3>
                            <p class="text-emerald-400 text-xs font-semibold mt-1">⭐ ${movie.vote_average.toFixed(1)}</p>
                        </div>
                    `;
                    container.appendChild(card);
                }
            });
        }

        // Fungsi Buka Player Modal
        function openPlayer(tmdbId, title) {
            const modal = document.getElementById('player-modal');
            const frame = document.getElementById('video-frame');
            const titleEl = document.getElementById('player-title');

            titleEl.innerText = title;
            // Nembak Vidsrc
            frame.src = `https://vidsrc.me/embed/movie?tmdb=${tmdbId}`;
            
            // Tampilkan modal dengan animasi fade in
            modal.classList.remove('hidden');
            // Sedikit delay agar transisi CSS bekerja
            setTimeout(() => { modal.classList.remove('opacity-0'); }, 10);
            
            // Nonaktifkan scroll pada body saat nonton
            document.body.style.overflow = 'hidden';
        }

        // Fungsi Tutup Player
        function closePlayer() {
            const modal = document.getElementById('player-modal');
            const frame = document.getElementById('video-frame');

            modal.classList.add('opacity-0');
            
            // Tunggu transisi selesai baru hide elemen dan matikan video
            setTimeout(() => {
                modal.classList.add('hidden');
                frame.src = '';
                document.body.style.overflow = 'auto'; // Kembalikan scroll body
            }, 300);
        }

        // Jalankan saat web diload
        fetchMovies('/trending/movie/day', 'trending-row', true);
        fetchMovies('/movie/top_rated', 'toprated-row', false);
    </script>
</body>
</html>
